<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Oto Pusula simgesi: önden görünen araba, ızgarasında marka logosu yerine pusula rozeti. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f5e57"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7f5ef"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- tekerlekler -->
  <rect x="20" y="86" width="18" height="20" rx="6" fill="#0b2f2c"/>
  <rect x="90" y="86" width="18" height="20" rx="6" fill="#0b2f2c"/>
  <!-- tavan ve ön cam -->
  <path d="M33 60 L43 35 Q45 30 51 30 L77 30 Q83 30 85 35 L95 60 Z" fill="url(#body)"/>
  <path d="M41 58 L49 38 Q50.5 35 54 35 L74 35 Q77.5 35 79 38 L87 58 Z" fill="#0b2f2c"/>
  <path d="M52 38 L58 38 L52 54 L47 54 Z" fill="#ffffff" opacity="0.18"/>
  <!-- gövde -->
  <rect x="14" y="56" width="100" height="36" rx="13" fill="url(#body)"/>
  <!-- farlar -->
  <rect x="21" y="64" width="22" height="11" rx="5.5" fill="url(#lamp)"/>
  <rect x="85" y="64" width="22" height="11" rx="5.5" fill="url(#lamp)"/>
  <!-- ızgara -->
  <rect x="44" y="66" width="40" height="17" rx="8.5" fill="#0b2f2c"/>
  <!-- tampon çizgisi -->
  <rect x="26" y="85" width="76" height="3" rx="1.5" fill="#0f5e57" opacity="0.35"/>
  <!-- pusula rozeti (marka logosu yerine) -->
  <circle cx="64" cy="74.5" r="13" fill="#ffffff" stroke="#0b2f2c" stroke-width="2.5"/>
  <path d="M64 63.5 L68.2 74.5 L59.8 74.5 Z" fill="#ef4444"/>
  <path d="M64 85.5 L68.2 74.5 L59.8 74.5 Z" fill="#0f5e57"/>
  <circle cx="64" cy="74.5" r="2" fill="#ffffff" stroke="#0b2f2c" stroke-width="1"/>
</svg>
